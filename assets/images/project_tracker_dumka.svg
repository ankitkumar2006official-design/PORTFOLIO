<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- Glow blobs -->
  <circle cx="950" cy="180" r="180" fill="#10b981" opacity="0.12" filter="url(#glow)"/>
  <circle cx="250" cy="520" r="140" fill="#06b6d4" opacity="0.08" filter="url(#glow)"/>

  <!-- Main Application Window Card -->
  <g transform="translate(80, 60)">
    <!-- Browser Window Chrome -->
    <rect width="1040" height="555" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Titlebar -->
    <rect width="1040" height="48" rx="16" fill="#1e293b" opacity="0.95"/>
    <circle cx="30" cy="24" r="6" fill="#ef4444"/>
    <circle cx="50" cy="24" r="6" fill="#f59e0b"/>
    <circle cx="70" cy="24" r="6" fill="#10b981"/>

    <!-- URL pill -->
    <rect x="260" y="10" width="520" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="520" y="28" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">dumka-sports-tracker.vercel.app</text>

    <!-- App Header Inside -->
    <g transform="translate(30, 75)">
      <!-- Brand & Title -->
      <rect x="0" y="0" width="36" height="36" rx="8" fill="url(#accentGrad)"/>
      <path d="M12 24 L18 12 L24 24 M15 20 L21 20" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      
      <text x="48" y="22" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="19">Tracker — Dumka Sports Academy</text>
      <text x="48" y="38" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="12">Athlete Performance & Academy Management Platform</text>
      
      <!-- Live Status Badge -->
      <rect x="830" y="4" width="150" height="28" rx="14" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
      <circle cx="848" cy="18" r="4" fill="#10b981"/>
      <text x="918" y="22" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">LIVE PRODUCTION</text>
    </g>

    <!-- Metrics Cards Row -->
    <g transform="translate(30, 140)">
      <!-- Metric 1 -->
      <rect x="0" y="0" width="225" height="90" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="20" y="30" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Total Athletes Enrolled</text>
      <text x="20" y="66" fill="#f1f5f9" font-family="'Outfit', sans-serif" font-weight="700" font-size="28">128</text>
      <text x="140" y="64" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12">+14% MoM</text>

      <!-- Metric 2 -->
      <rect x="245" y="0" width="225" height="90" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="265" y="30" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Active Training Programs</text>
      <text x="265" y="66" fill="#f1f5f9" font-family="'Outfit', sans-serif" font-weight="700" font-size="28">8 Sports</text>
      <text x="400" y="64" fill="#06b6d4" font-family="'JetBrains Mono', monospace" font-size="12">Archery, Track</text>

      <!-- Metric 3 -->
      <rect x="490" y="0" width="245" height="90" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="510" y="30" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Attendance & Training Logs</text>
      <text x="510" y="66" fill="#f1f5f9" font-family="'Outfit', sans-serif" font-weight="700" font-size="28">94.2%</text>
      <text x="645" y="64" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12">On-Track</text>

      <!-- Metric 4 -->
      <rect x="755" y="0" width="225" height="90" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="775" y="30" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Database Layer</text>
      <text x="775" y="66" fill="#f1f5f9" font-family="'Outfit', sans-serif" font-weight="700" font-size="24">MongoDB Atlas</text>
    </g>

    <!-- Analytics Chart & Roster Section -->
    <g transform="translate(30, 250)">
      <!-- Left: Performance Analytics Chart Box -->
      <rect x="0" y="0" width="600" height="225" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="24" y="34" fill="#f1f5f9" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14">Weekly Attendance & Fitness Benchmarks</text>
      
      <!-- Graph Lines -->
      <path d="M 40 180 L 120 150 L 200 165 L 280 120 L 360 135 L 440 90 L 520 70 L 560 65" fill="none" stroke="url(#accentGrad)" stroke-width="3.5" stroke-linecap="round"/>
      <polygon points="40,180 120,150 200,165 280,120 360,135 440,90 520,70 560,65 560,200 40,200" fill="url(#chartGrad)"/>
      
      <!-- Data points -->
      <circle cx="120" cy="150" r="5" fill="#10b981"/>
      <circle cx="280" cy="120" r="5" fill="#10b981"/>
      <circle cx="440" cy="90" r="5" fill="#06b6d4"/>
      <circle cx="560" cy="65" r="5" fill="#06b6d4"/>

      <!-- X-axis labels -->
      <text x="120" y="210" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Week 1</text>
      <text x="280" y="210" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Week 2</text>
      <text x="440" y="210" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Week 3</text>
      <text x="560" y="210" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Week 4</text>

      <!-- Right: Athlete Roster & Workflows Box -->
      <g transform="translate(620, 0)">
        <rect x="0" y="0" width="360" height="225" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="20" y="34" fill="#f1f5f9" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14">Recent Athlete Entries</text>

        <!-- Athlete row 1 -->
        <g transform="translate(20, 52)">
          <rect width="320" height="42" rx="8" fill="#1e293b" fill-opacity="0.6"/>
          <circle cx="22" cy="21" r="12" fill="#3b82f6"/>
          <text x="22" y="25" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">RS</text>
          <text x="46" y="20" fill="#f1f5f9" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Rahul Soren</text>
          <text x="46" y="34" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Archery • U-19 Squad</text>
          <rect x="235" y="12" width="70" height="18" rx="9" fill="#10b981" fill-opacity="0.2"/>
          <text x="270" y="25" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Qualified</text>
        </g>

        <!-- Athlete row 2 -->
        <g transform="translate(20, 102)">
          <rect width="320" height="42" rx="8" fill="#1e293b" fill-opacity="0.6"/>
          <circle cx="22" cy="21" r="12" fill="#ec4899"/>
          <text x="22" y="25" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">PM</text>
          <text x="46" y="20" fill="#f1f5f9" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Pooja Murmu</text>
          <text x="46" y="34" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Athletics • 400m Sprint</text>
          <rect x="235" y="12" width="70" height="18" rx="9" fill="#06b6d4" fill-opacity="0.2"/>
          <text x="270" y="25" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Training</text>
        </g>

        <!-- Athlete row 3 -->
        <g transform="translate(20, 152)">
          <rect width="320" height="42" rx="8" fill="#1e293b" fill-opacity="0.6"/>
          <circle cx="22" cy="21" r="12" fill="#8b5cf6"/>
          <text x="22" y="25" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">AK</text>
          <text x="46" y="20" fill="#f1f5f9" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Amit Kisku</text>
          <text x="46" y="34" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Football • Academy A</text>
          <rect x="235" y="12" width="70" height="18" rx="9" fill="#10b981" fill-opacity="0.2"/>
          <text x="270" y="25" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Active</text>
        </g>
      </g>
    </g>
  </g>
</svg>

