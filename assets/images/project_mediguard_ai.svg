<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09101d"/>
      <stop offset="50%" stop-color="#0d1b2e"/>
      <stop offset="100%" stop-color="#060b13"/>
    </linearGradient>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162238" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0d1627" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="ecgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad2)"/>

  <!-- Subtle Hexagonal/Grid Network Pattern -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- Ambient Glows -->
  <circle cx="200" cy="180" r="160" fill="#0ea5e9" opacity="0.12" filter="url(#glow2)"/>
  <circle cx="1020" cy="500" r="190" fill="#6366f1" opacity="0.14" filter="url(#glow2)"/>

  <!-- Main Application Dashboard Frame -->
  <g transform="translate(80, 60)">
    <rect width="1040" height="555" rx="16" fill="url(#cardGrad2)" stroke="#1e3a5f" stroke-width="1.5"/>

    <!-- Titlebar -->
    <rect width="1040" height="48" rx="16" fill="#0f1f38" opacity="0.95"/>
    <circle cx="30" cy="24" r="6" fill="#ef4444"/>
    <circle cx="50" cy="24" r="6" fill="#f59e0b"/>
    <circle cx="70" cy="24" r="6" fill="#10b981"/>

    <!-- URL bar -->
    <rect x="260" y="10" width="520" height="28" rx="14" fill="#08111e" stroke="#1e3a5f" stroke-width="1"/>
    <text x="520" y="28" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">frontend-fawn-eight-96.vercel.app</text>

    <!-- App Header -->
    <g transform="translate(30, 75)">
      <!-- Cross / Shield Icon -->
      <rect x="0" y="0" width="36" height="36" rx="8" fill="url(#medGrad)"/>
      <path d="M18 10 L18 26 M10 18 L26 18" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

      <text x="48" y="22" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="19">MediGuard AI — Operation Ward Zero</text>
      <text x="48" y="38" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="12">Intelligent Hospital Triage & Clinical Decision Support System</text>

      <!-- AI Active Badge -->
      <rect x="810" y="4" width="170" height="28" rx="14" fill="#0ea5e9" fill-opacity="0.15" stroke="#0ea5e9" stroke-width="1"/>
      <circle cx="828" cy="18" r="4" fill="#38bdf8"/>
      <text x="903" y="22" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">AI TRIAGE ONLINE</text>
    </g>

    <!-- Key Vitals / Ward Stats -->
    <g transform="translate(30, 140)">
      <rect x="0" y="0" width="235" height="90" rx="12" fill="#0b1728" stroke="#1c2e48" stroke-width="1"/>
      <text x="20" y="30" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Ward Zero Capacity</text>
      <text x="20" y="66" fill="#f1f5f9" font-family="'Outfit', sans-serif" font-weight="700" font-size="28">18 / 24</text>
      <text x="140" y="64" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">75% Occupancy</text>

      <rect x="255" y="0" width="235" height="90" rx="12" fill="#0b1728" stroke="#1c2e48" stroke-width="1"/>
      <text x="275" y="30" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Critical Triage Alerts</text>
      <text x="275" y="66" fill="#f43f5e" font-family="'Outfit', sans-serif" font-weight="700" font-size="28">2 Active</text>
      <text x="400" y="64" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="12">Priority 1</text>

      <rect x="510" y="0" width="235" height="90" rx="12" fill="#0b1728" stroke="#1c2e48" stroke-width="1"/>
      <text x="530" y="30" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Avg AI Triage Latency</text>
      <text x="530" y="66" fill="#f1f5f9" font-family="'Outfit', sans-serif" font-weight="700" font-size="28">380 ms</text>
      <text x="655" y="64" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12">Instant</text>

      <rect x="765" y="0" width="215" height="90" rx="12" fill="#0b1728" stroke="#1c2e48" stroke-width="1"/>
      <text x="785" y="30" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">AI Risk Confidence</text>
      <text x="785" y="66" fill="#f1f5f9" font-family="'Outfit', sans-serif" font-weight="700" font-size="28">97.4%</text>
      <text x="915" y="64" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="12">Validated</text>
    </g>

    <!-- Lower Section: ECG Live Stream & Patient Triage Queue -->
    <g transform="translate(30, 250)">
      <!-- ECG & Patient Diagnostics Box -->
      <rect x="0" y="0" width="570" height="225" rx="12" fill="#0b1728" stroke="#1c2e48" stroke-width="1"/>
      <text x="24" y="34" fill="#f1f5f9" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14">Continuous Multi-Lead Telemetry (Bed 04 - ICU)</text>
      
      <!-- ECG Waveform -->
      <path d="M 30 110 L 100 110 L 120 110 L 130 90 L 140 140 L 155 40 L 170 160 L 180 110 L 220 110 L 250 110 L 260 90 L 270 140 L 285 40 L 300 160 L 310 110 L 370 110 L 390 90 L 400 140 L 415 40 L 430 160 L 440 110 L 530 110" fill="none" stroke="url(#ecgGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Telemetry indicators -->
      <g transform="translate(30, 165)">
        <rect width="115" height="42" rx="8" fill="#162238"/>
        <text x="14" y="18" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">HEART RATE</text>
        <text x="14" y="34" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">76 BPM</text>

        <rect x="135" width="115" height="42" rx="8" fill="#162238"/>
        <text x="149" y="18" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">SpO2 SAT</text>
        <text x="149" y="34" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">98.5%</text>

        <rect x="270" width="115" height="42" rx="8" fill="#162238"/>
        <text x="284" y="18" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">SYS / DIA</text>
        <text x="284" y="34" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">120/80</text>

        <rect x="405" width="105" height="42" rx="8" fill="#162238"/>
        <text x="419" y="18" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">RESP RATE</text>
        <text x="419" y="34" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">16 /min</text>
      </g>

      <!-- AI Clinical Decision Assistance Box -->
      <g transform="translate(590, 0)">
        <rect x="0" y="0" width="390" height="225" rx="12" fill="#0b1728" stroke="#1c2e48" stroke-width="1"/>
        <text x="20" y="34" fill="#f1f5f9" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14">AI Clinical Priority Triage</text>

        <!-- Patient 1 -->
        <g transform="translate(20, 52)">
          <rect width="350" height="44" rx="8" fill="#162238"/>
          <circle cx="20" cy="22" r="5" fill="#f43f5e"/>
          <text x="34" y="20" fill="#f1f5f9" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Patient #W0-109</text>
          <text x="34" y="34" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Acute Sepsis Risk Flag • ER Bay 2</text>
          <rect x="255" y="12" width="82" height="20" rx="10" fill="#f43f5e" fill-opacity="0.2"/>
          <text x="296" y="26" fill="#fb7185" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Priority 1</text>
        </g>

        <!-- Patient 2 -->
        <g transform="translate(20, 104)">
          <rect width="350" height="44" rx="8" fill="#162238"/>
          <circle cx="20" cy="22" r="5" fill="#f59e0b"/>
          <text x="34" y="20" fill="#f1f5f9" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Patient #W0-114</text>
          <text x="34" y="34" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Respiratory Syncytial • Ward 3</text>
          <rect x="255" y="12" width="82" height="20" rx="10" fill="#f59e0b" fill-opacity="0.2"/>
          <text x="296" y="26" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Priority 2</text>
        </g>

        <!-- Patient 3 -->
        <g transform="translate(20, 156)">
          <rect width="350" height="44" rx="8" fill="#162238"/>
          <circle cx="20" cy="22" r="5" fill="#10b981"/>
          <text x="34" y="20" fill="#f1f5f9" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Patient #W0-120</text>
          <text x="34" y="34" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Post-Op Stable Telemetry • Bed 12</text>
          <rect x="255" y="12" width="82" height="20" rx="10" fill="#10b981" fill-opacity="0.2"/>
          <text x="296" y="26" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Routine</text>
        </g>
      </g>
    </g>
  </g>
</svg>

